    function useIntersection(ref, options = {}) {
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setIsVisible(true); obs.disconnect(); }
        }, { threshold: 0.12, ...options });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return isVisible;
    }

        setPrevPoints(simulatedPoints);
        setSimulatedPoints(val);

          setAnimKey(k => k + 1);
        }
      };

      useEffect(() => {
        const slider = document.getElementById('points-slider');

          slider.style.setProperty('--val', `${(simulatedPoints / MAX_POINTS) * 100}%`);

      }, [simulatedPoints]);

        { fill: '#C89460', stroke: '#A0703A', label: 'Dulce de leche' },
        { fill: '#F48FB1', stroke: '#E91E63', label: 'Frutilla'       },
        { fill: '#5C3A1E', stroke: '#3D2B1F', label: 'Chocolate'      },
        { fill: '#F5D78E', stroke: '#E0B84A', label: 'Sambayón'       },
        { fill: '#A8D5BA', stroke: '#5B8C6E', label: 'Menta'          },

              </h2>
              <p className="font-body text-chocolate-light text-lg max-w-xl mx-auto">

            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
              {/* Left: User card + slider */}
              <div className="flex flex-col gap-6">
                {/* User card */}
                <div className="bg-white rounded-2xl p-6 border border-pistacho/30 shadow-sm">

                    </div>
                  </div>

                  {/* Points display */}
                  <div className="flex items-baseline justify-between mb-3">
                    <span className="font-display font-700 text-4xl text-menta">{simulatedPoints}</span>
                    <span className="font-body text-chocolate-light text-sm">/ {MAX_POINTS} puntos</span>
                  </div>

                  {/* Progress bar */}
                  <div className="relative h-3 rounded-full bg-pistacho/20 overflow-hidden mb-1" role="progressbar" aria-valuenow={simulatedPoints} aria-valuemin={0} aria-valuemax={MAX_POINTS} aria-label="Progreso de puntos">
                    <div

                    id="points-slider"
                    type="range"

                    aria-label="Simular cantidad de puntos"
                  />

                  )}
                  {simulatedPoints > 0 && simulatedPoints < MAX_POINTS && (
                    <div className="mt-4 p-3 rounded-xl bg-pistacho/15 border border-pistacho/30">

                      </p>

                    viewBox="0 0 220 360"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                  >
                    {/* ── CONE ── */}
                    <defs>
                      <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stopColor="#F5C87A"/>
                        <stop offset="100%" stopColor="#D4924A"/>
                      </linearGradient>
                      <linearGradient id="coneShadow" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stopColor="#C07820" stopOpacity="0.3"/>
                        <stop offset="100%" stopColor="transparent"/>
                      </linearGradient>
                      {/* Clip for each scoop circle */}
                      {scoopColors.map((_, i) => (
                        <clipPath key={i} id={`clip-scoop-${i}`}>
                          <circle cx="110" cy={220 - i * 52} r="46"/>
                        </clipPath>
                      ))}
                    </defs>

                    {/* Cone body */}
                    <path d="M65 235 L110 355 L155 235 Z" fill="url(#coneGrad)" />
                    {/* Cone lines (waffle pattern) */}
                    <g stroke="#C07820" strokeWidth="1" strokeOpacity="0.4">
                      <line x1="88" y1="240" x2="110" y2="355"/>
                      <line x1="110" y1="240" x2="110" y2="355"/>
                      <line x1="132" y1="240" x2="110" y2="355"/>
                      <line x1="70" y1="258" x2="148" y2="258"/>
                      <line x1="74" y1="278" x2="146" y2="278"/>
                      <line x1="80" y1="298" x2="140" y2="298"/>
                      <line x1="88" y1="318" x2="132" y2="318"/>
                    </g>
                    {/* Cone rim */}
                    <ellipse cx="110" cy="237" rx="46" ry="9" fill="#E8A845" />
                    <ellipse cx="110" cy="235" rx="46" ry="9" fill="#F5C87A" />

                    {/* ── SCOOPS (rendered bottom to top) ── */}
                    {scoopColors.map((sc, i) => {
                      if (i >= scoops) return null;
                      const cy = 220 - i * 52;
                      const isTop = i === scoops - 1;
                      return (
                        <g
                          key={`${animKey}-${i}`}
                          className={isTop ? 'scoop-animate' : ''}
                          style={isTop ? { transformOrigin: `110px ${cy}px` } : {}}
                        >
                          {/* Shadow */}
                          <ellipse cx="110" cy={cy + 6} rx="43" ry="8" fill={sc.stroke} fillOpacity="0.2"/>
                          {/* Main scoop */}
                          <circle cx="110" cy={cy} r="46" fill={sc.fill} />
                          {/* Highlight */}
                          <circle cx="97" cy={cy - 14} r="12" fill="white" fillOpacity="0.2"/>
                          <circle cx="92" cy={cy - 18} r="5" fill="white" fillOpacity="0.3"/>
                          {/* Stroke */}
                          <circle cx="110" cy={cy} r="46" fill="none" stroke={sc.stroke} strokeWidth="1.5"/>
                        </g>
                      );
                    })}

                    {/* Empty scoops (ghost) */}
                    {scoopColors.map((sc, i) => {
                      if (i < scoops) return null;
                      const cy = 220 - i * 52;
                      return (
                        <g key={`empty-${i}`} opacity="0.12">
                          <circle cx="110" cy={cy} r="46" fill="#A8D5BA" stroke="#5B8C6E" strokeWidth="1" strokeDasharray="4 3"/>
                        </g>
                      );
                    })}

                    {/* Drip on top scoop (if scoops > 0) */}
                    {scoops > 0 && (() => {
                      const topIdx = scoops - 1;
                      const sc = scoopColors[topIdx];
                      const topCy = 220 - topIdx * 52;
                      return (
                        <g>
                          <path
                            d={`M102 ${topCy + 38} Q100 ${topCy + 52} 103 ${topCy + 60} Q106 ${topCy + 68} 104 ${topCy + 80}`}
                            stroke={sc.fill}
                            strokeWidth="7"
                            strokeLinecap="round"
                            fill="none"
                            opacity="0.7"
                          />
                        </g>
                      );
                    })()}
                  </svg>
                </div>

                {/* Scoop count legend */}
                <div className="flex flex-wrap justify-center gap-2 max-w-xs">
                  {scoopColors.map((sc, i) => (
                    <span
                      key={i}
                      className={`inline-flex items-center gap-1.5 text-xs font-body px-2.5 py-1 rounded-full transition-all duration-300
                        ${i < scoops ? 'font-600 text-chocolate shadow-sm' : 'text-chocolate-light opacity-40'}`}
                      style={i < scoops ? { background: sc.fill + '33', border: `1px solid ${sc.fill}88` } : { background: '#f0f0f0' }}
                    >
                      <span
                        className="w-2.5 h-2.5 rounded-full inline-block"
                        style={{ background: sc.fill, border: `1px solid ${sc.stroke}` }}
                      />
                      {sc.label}
                    </span>
                  ))}
                </div>

                <p className="font-body text-chocolate-light text-sm text-center max-w-xs">
                  {scoops === 0 && 'Empezá a comprar para llenar tu copa'}
                  {scoops === 1 && '¡Primera bola! Seguí comprando'}
                  {scoops === 2 && 'Vas muy bien — ¡dos bolas!'}
                  {scoops === 3 && '¡A más de la mitad! Falta poco'}
                  {scoops === 4 && '¡Casi llegas! Una compra más'}
                  {scoops === 5 && '🎉 ¡Copa llena! Canjeá tu helado gratis'}
                </p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function App() {
      // Intersection observer for section reveals
      useEffect(() => {
        const sections = document.querySelectorAll('.section-reveal');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
            }
          });
        }, { threshold: 0.08 });
        sections.forEach(s => obs.observe(s));
        return () => obs.disconnect();
      }, []);

      return (
        <>

          <main>
            <Hero />
            <HeladeriaParaTodos />
            <Sabores />
            <ComoFunciona />
            <MedidorHelado />
            <Suscripcion />
          </main>

        </>
      );
    }
